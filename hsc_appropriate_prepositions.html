<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HSC Appropriate Prepositions (2015-2025)</title>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --shadow: 0 4px 6px -1px rgba(0,0,0,0.05), 0 2px 4px -2px rgba(0,0,0,0.05);
            --accent-green: #10b981;
            --accent-purple: #8b5cf6;
        }

        [data-theme="dark"] {
            --primary: #6366f1;
            --primary-hover: #818cf8;
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
            --shadow: 0 4px 6px -1px rgba(0,0,0,0.3);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', 'Hind Siliguri', sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            transition: background-color 0.3s, color 0.3s;
            line-height: 1.6;
            padding-bottom: 60px;
        }

        header {
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            color: white;
            padding: 2.5rem 1rem;
            text-align: center;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1);
            position: relative;
        }

        header h1 {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 1rem;
        }

        .controls {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 1.25rem;
            margin: -25px auto 2rem;
            position: relative;
            z-index: 10;
            box-shadow: var(--shadow);
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            align-items: center;
            justify-content: space-between;
        }

        .search-box {
            flex: 1;
            min-width: 250px;
            position: relative;
        }

        .search-box input {
            width: 100%;
            padding: 0.75rem 1rem 0.75rem 2.5rem;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: var(--bg);
            color: var(--text-main);
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .search-box input:focus {
            border-color: var(--primary);
        }

        .search-icon {
            position: absolute;
            left: 0.8rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            width: 18px;
            height: 18px;
        }

        .btn-group {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .btn {
            padding: 0.6rem 1.2rem;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: var(--card-bg);
            color: var(--text-main);
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            font-size: 0.9rem;
        }

        .btn:hover {
            border-color: var(--primary);
            color: var(--primary);
        }

        .btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .filter-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-bottom: 2rem;
            justify-content: center;
        }

        .tag-btn {
            padding: 0.4rem 1rem;
            border-radius: 20px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            color: var(--text-muted);
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 500;
            transition: all 0.2s;
        }

        .tag-btn:hover, .tag-btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .stats-bar {
            text-align: center;
            margin-bottom: 1.5rem;
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        /* Mode: Grid View */
        .prep-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.25rem;
        }

        .prep-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 1.25rem;
            box-shadow: var(--shadow);
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            overflow: hidden;
        }

        .prep-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px -5px rgba(0,0,0,0.1);
        }

        .prep-card::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 4px;
            background: var(--primary);
        }

        .prep-title {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 0.3rem;
        }

        .prep-meaning {
            font-size: 1.05rem;
            color: var(--text-main);
            font-weight: 500;

        }

        .prep-category {
            display: inline-block;
            margin-top: 0.75rem;
            font-size: 0.75rem;
            padding: 0.2rem 0.6rem;
            border-radius: 6px;
            background: rgba(79, 70, 229, 0.1);
            color: var(--primary);
            font-weight: 600;
            align-self: flex-start;
        }

        /* Flashcard View */
        .flashcard-wrapper {
            display: none;
            max-width: 500px;
            margin: 2rem auto;
            perspective: 1000px;
        }

        .flashcard {
            width: 100%;
            height: 280px;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
        }

        .flashcard.flipped {
            transform: rotateY(180deg);
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 20px;
            border: 1px solid var(--border);
            background: var(--card-bg);
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            text-align: center;
        }

        .card-back {
            transform: rotateY(180deg);
            background: linear-gradient(145deg, var(--card-bg), var(--bg));
        }

        .flashcard-controls {
            display: none;
            justify-content: center;
            align-items: center;
            gap: 1.5rem;
            margin-top: 1.5rem;
        }

        /* Quiz View */
        .quiz-wrapper {
            display: none;
            max-width: 650px;
            margin: 2rem auto;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 2rem;
            box-shadow: var(--shadow);
        }

        .quiz-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            font-weight: 600;
        }

        .quiz-question {
            font-size: 1.3rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
            color: var(--text-main);
        }

        .quiz-options {
            display: grid;
            grid-template-columns: 1fr;
            gap: 0.75rem;
        }

        .quiz-opt {
            padding: 1rem;
            border-radius: 12px;
            border: 1px solid var(--border);
            background: var(--bg);
            color: var(--text-main);
            font-size: 1rem;
            cursor: pointer;
            text-align: left;
            transition: all 0.2s;
            font-weight: 500;
        }

        .quiz-opt:hover {
            border-color: var(--primary);
            background: rgba(79, 70, 229, 0.05);
        }

        .quiz-opt.correct {
            background: #d1fae5 !important;
            border-color: #10b981 !important;
            color: #065f46 !important;
        }

        .quiz-opt.wrong {
            background: #fee2e2 !important;
            border-color: #ef4444 !important;
            color: #991b1b !important;
        }

        .theme-toggle {
            position: absolute;
            top: 1rem;
            right: 1rem;
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
            padding: 0.5rem;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .no-results {
            text-align: center;
            padding: 3rem;
            color: var(--text-muted);
            grid-column: 1 / -1;
        }

        @media (max-width: 600px) {
            header h1 { font-size: 1.5rem; }
            .controls { flex-direction: column; }
            .btn-group { width: 100%; justify-content: center; }
            .search-box { width: 100%; }
        }
    </style>
</head>
<body>

    <header>
        <button class="theme-toggle" id="themeToggle" title="Toggle Dark/Light Mode">
            <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
        </button>
        <div class="container">
            <h1>HSC Appropriate Prepositions</h1>
            <p>২০১৫ - ২০২৫ সালের সকল বোর্ড পরীক্ষার প্রশ্ন সংকলন</p>
        </div>
    </header>

    <div class="container">
        <div class="controls">
            <div class="search-box">
                <svg class="search-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                <input type="text" id="searchInput" placeholder="শব্দ বা অর্থ দিয়ে খুঁজুন (e.g. Accustomed, অভ্যস্ত)...">
            </div>
            <div class="btn-group">
                <button class="btn active" id="viewAllBtn" onclick="switchView('grid')">
                    <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 10h16M4 14h16M4 18h16"></path></svg>
                    তালিকা
                </button>
                <button class="btn" id="viewCardBtn" onclick="switchView('flashcard')">
                    <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
                    ফ্ল্যাশকার্ড
                </button>
                <button class="btn" id="viewQuizBtn" onclick="switchView('quiz')">
                    <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    কুইজ টেস্ট
                </button>
            </div>
        </div>

        <!-- Filter Tags -->
        <div class="filter-tags" id="filterTags">
            <button class="tag-btn active" onclick="filterCategory('ALL')">সকল (All)</button>
            <button class="tag-btn" onclick="filterCategory('TO')">TO</button>
            <button class="tag-btn" onclick="filterCategory('OF')">OF</button>
            <button class="tag-btn" onclick="filterCategory('FROM')">FROM</button>
            <button class="tag-btn" onclick="filterCategory('IN')">IN</button>
            <button class="tag-btn" onclick="filterCategory('FOR')">FOR</button>
            <button class="tag-btn" onclick="filterCategory('ON / UPON')">ON / UPON</button>
            <button class="tag-btn" onclick="filterCategory('AT')">AT</button>
            <button class="tag-btn" onclick="filterCategory('MIXED')">OTHERS</button>
        </div>

        <div class="stats-bar" id="statsBar">
            মোট প্রিপজিশন সংখ্যা: <span id="totalCount">0</span> টি
        </div>

        <!-- Grid View Container -->
        <div class="prep-grid" id="prepGrid"></div>

        <!-- Flashcard View Container -->
        <div class="flashcard-wrapper" id="flashcardWrapper">
            <div class="flashcard" id="flashcard" onclick="flipCard()">
                <div class="card-face card-front">
                    <span style="font-size:0.9rem; color:var(--text-muted); margin-bottom:1rem;" id="fcCategory">CATEGORY</span>
                    <h2 style="font-size:1.8rem; color:var(--primary);" id="fcWord">Word</h2>
                    <p style="margin-top:1rem; font-size:0.85rem; color:var(--text-muted);">(ক্লিক করে অর্থ দেখুন)</p>
                </div>
                <div class="card-face card-back">
                    <h3 style="font-size:1.6rem; color:var(--text-main);" id="fcMeaning">অর্থ</h3>
                </div>
            </div>
        </div>
        <div class="flashcard-controls" id="flashcardControls">
            <button class="btn" onclick="prevCard()">◄ পূর্ববর্তী</button>
            <span id="fcProgress" style="font-weight:600; color:var(--text-muted);">1 / 50</span>
            <button class="btn" onclick="nextCard()">পরবর্তী ►</button>
        </div>

        <!-- Quiz View Container -->
        <div class="quiz-wrapper" id="quizWrapper">
            <div class="quiz-header">
                <span>প্রশ্ন: <span id="quizIndex">1</span>/<span id="quizTotal">10</span></span>
                <span>স্কোর: <span id="quizScore">0</span></span>
            </div>
            <div class="quiz-question" id="quizQuestion">Loading...</div>
            <div class="quiz-options" id="quizOptions"></div>
            <button class="btn active" id="quizNextBtn" style="margin-top:1.5rem; width:100%; justify-content:center; display:none;" onclick="nextQuestion()">পরবর্তী প্রশ্ন</button>
        </div>
    </div>

            // 6. ON / UPON
            { word: "Base on", meaning: "ভিত্তি করা", cat: "ON / UPON" },
            { word: "Congratulate on", meaning: "অভিনন্দন জানানো", cat: "ON / UPON" },
            { word: "Depend on / Rely on", meaning: "নির্ভর করা", cat: "ON / UPON" },
            { word: "Impact on", meaning: "প্রভাব", cat: "ON / UPON" },
            { word: "Insist on", meaning: "জিদ ধরা", cat: "ON / UPON" },
            { word: "Live on", meaning: "খেয়ে বাঁচা", cat: "ON / UPON" },
            { word: "Look down upon", meaning: "ঘৃণা করা", cat: "ON / UPON" },

            // 7. AT
            { word: "Aim at", meaning: "লক্ষ্য স্থির করা", cat: "AT" },
            { word: "Good at / Skilled at", meaning: "দক্ষ", cat: "AT" },
            { word: "Weak at", meaning: "কাঁচা/দুর্বল", cat: "AT" },
            { word: "Look at", meaning: "তাকানো", cat: "AT" },

            // 8. OTHERS / MIXED
            { word: "Abide by", meaning: "মেনে চলা", cat: "MIXED" },
            { word: "Associate with", meaning: "সংযুক্ত", cat: "MIXED" },
            { word: "Cope with", meaning: "মানিয়ে নেওয়া", cat: "MIXED" },
            { word: "Hanker after", meaning: "মোহ লালসা করা", cat: "MIXED" },
            { word: "Provide with", meaning: "সরবরাহ করা", cat: "MIXED" },
            { word: "Run out", meaning: "শেষ হয়ে যাওয়া", cat: "MIXED" },
            { word: "Sympathize with", meaning: "সহানুভূতি প্রকাশ", cat: "MIXED" }
        ];

        let filteredData = [...rawData];
        let currentCategory = "ALL";
        let currentSearch = "";
        let flashcardIndex = 0;

        // Elements
        const prepGrid = document.getElementById('prepGrid');
        const searchInput = document.getElementById('searchInput');
        const totalCount = document.getElementById('totalCount');
        const flashcardWrapper = document.getElementById('flashcardWrapper');
        const flashcardControls = document.getElementById('flashcardControls');
        const quizWrapper = document.getElementById('quizWrapper');
        const themeToggle = document.getElementById('themeToggle');

        // Render Functions
        function renderGrid() {
            prepGrid.innerHTML = "";
            if (filteredData.length === 0) {
                prepGrid.innerHTML = `<div class="no-results">কোনো ফলাফল পাওয়া যায়নি!</div>`;
                return;
            }
            filteredData.forEach(item => {
                const card = document.createElement('div');
                card.className = 'prep-card';
                card.innerHTML = `
                    <div>
                        <div class="prep-title">${item.word}</div>
                        <div class="prep-meaning">${item.meaning}</div>
                    </div>
                    <span class="prep-category">Preposition: ${item.cat}</span>
                `;
                prepGrid.appendChild(card);
            });
            totalCount.innerText = filteredData.length;
        }

        // Filter & Search
        function applyFilters() {
            filteredData = rawData.filter(item => {
                const matchesCat = currentCategory === "ALL" || item.cat === currentCategory;
                const matchesSearch = item.word.toLowerCase().includes(currentSearch.toLowerCase()) || 
                                      item.meaning.toLowerCase().includes(currentSearch.toLowerCase());
                return matchesCat && matchesSearch;
            });
            renderGrid();
            flashcardIndex = 0;
            updateFlashcard();
        }

        searchInput.addEventListener('input', (e) => {
            currentSearch = e.target.value;
            applyFilters();
        });

        function filterCategory(cat) {
            currentCategory = cat;
            document.querySelectorAll('.tag-btn').forEach(btn => {
                btn.classList.toggle('active', btn.innerText.includes(cat) || (cat === 'ALL' && btn.innerText.includes('সকল')));
            });
            applyFilters();
        }

        // Views Switching
        function switchView(view) {
            document.getElementById('viewAllBtn').classList.toggle('active', view === 'grid');
            document.getElementById('viewCardBtn').classList.toggle('active', view === 'flashcard');
            document.getElementById('viewQuizBtn').classList.toggle('active', view === 'quiz');

            prepGrid.style.display = view === 'grid' ? 'grid' : 'none';
            flashcardWrapper.style.display = view === 'flashcard' ? 'block' : 'none';
            flashcardControls.style.display = view === 'flashcard' ? 'flex' : 'none';
            quizWrapper.style.display = view === 'quiz' ? 'block' : 'none';
            document.getElementById('filterTags').style.display = view === 'quiz' ? 'none' : 'flex';
            document.getElementById('statsBar').style.display = view === 'quiz' ? 'none' : 'block';

            if (view === 'flashcard') updateFlashcard();
            if (view === 'quiz') startQuiz();
        }

        // Flashcard Logic
        function updateFlashcard() {
            if (filteredData.length === 0) return;
            const item = filteredData[flashcardIndex];
            document.getElementById('flashcard').classList.remove('flipped');
            setTimeout(() => {
                document.getElementById('fcWord').innerText = item.word;
                document.getElementById('fcMeaning').innerText = item.meaning;
                document.getElementById('fcCategory').innerText = "Preposition Category: " + item.cat;
                document.getElementById('fcProgress').innerText = `${flashcardIndex + 1} / ${filteredData.length}`;
            }, 200);
        }

        function flipCard() {
            document.getElementById('flashcard').classList.toggle('flipped');
        }

        function nextCard() {
            if (filteredData.length === 0) return;
            flashcardIndex = (flashcardIndex + 1) % filteredData.length;
            updateFlashcard();
        }

        function prevCard() {
            if (filteredData.length === 0) return;
            flashcardIndex = (flashcardIndex - 1 + filteredData.length) % filteredData.length;
            updateFlashcard();
        }

        // Quiz Logic
        let quizQuestions = [];
        let currentQIndex = 0;
        let score = 0;

        function startQuiz() {
            // Pick 10 random items
            const shuffled = [...rawData].sort(() => 0.5 - Math.random());
            quizQuestions = shuffled.slice(0, 10);
            currentQIndex = 0;
            score = 0;
            document.getElementById('quizTotal').innerText = quizQuestions.length;
            document.getElementById('quizScore').innerText = score;
            showQuestion();
        }

        function showQuestion() {
            document.getElementById('quizNextBtn').style.display = 'none';
            const q = quizQuestions[currentQIndex];
            document.getElementById('quizIndex').innerText = currentQIndex + 1;
            document.getElementById('quizQuestion').innerText = `"${q.meaning}" - এর জন্য কোনটি সঠিক Preposition?`;

            // Prepare options
            const correctOpt = q.word;
            let options = [correctOpt];
            
            while(options.length < 4) {
                const randItem = rawData[Math.floor(Math.random() * rawData.length)].word;
                if(!options.includes(randItem)) options.push(randItem);
            }
            options.sort(() => 0.5 - Math.random());

            const optsContainer = document.getElementById('quizOptions');
            optsContainer.innerHTML = '';
            options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'quiz-opt';
                btn.innerText = opt;
                btn.onclick = () => selectOption(btn, opt === correctOpt);
                optsContainer.appendChild(btn);
            });
        }

        function selectOption(selectedBtn, isCorrect) {
            const allOpts = document.querySelectorAll('.quiz-opt');
            allOpts.forEach(btn => btn.disabled = true);

            if(isCorrect) {
                selectedBtn.classList.add('correct');
                score += 10;
                document.getElementById('quizScore').innerText = score;
            } else {
                selectedBtn.classList.add('wrong');
                // Highlight correct one
                allOpts.forEach(btn => {
                    if(btn.innerText === quizQuestions[currentQIndex].word) {
                        btn.classList.add('correct');
                    }
                });
            }
            document.getElementById('quizNextBtn').style.display = 'block';
        }

        function nextQuestion() {
            currentQIndex++;
            if(currentQIndex < quizQuestions.length) {
                showQuestion();
            } else {
                document.getElementById('quizQuestion').innerText = `কুইজ সমাপ্ত! আপনার মোট স্কোর: ${score} / ${quizQuestions.length * 10}`;
                document.getElementById('quizOptions').innerHTML = '';
                document.getElementById('quizNextBtn').innerText = 'পুনরায় কুইজ দিন';
                document.getElementById('quizNextBtn').onclick = () => {
                    document.getElementById('quizNextBtn').innerText = 'পরবর্তী প্রশ্ন';
                    document.getElementById('quizNextBtn').onclick = nextQuestion;
                    startQuiz();
                };
            }
        }

        // Theme Toggle
        themeToggle.addEventListener('click', () => {
            const isDark = document.body.getAttribute('data-theme') === 'dark';
            document.body.setAttribute('data-theme', isDark ? 'light' : 'dark');
        });

        // Initialize
        renderGrid();
    </script>
</body>
</html>
